<svg xmlns="http://www.w3.org/2000/svg" width="206" height="194" viewBox="0 0 206 194"
     role="img" aria-labelledby="cube-title cube-description">
  <title id="cube-title">The bipartite cube graph</title>
  <desc id="cube-description">A tilted perspective drawing of two nested four-cycles with their corresponding corners joined. Each edge joins a solid teal vertex to an open gold vertex.</desc>

  <!-- Pale faces lend depth to the planar projection. Only the inked outlines are edges. -->
  <g stroke="none">
    <polygon points="24,67 123,18 127,50 71,78" fill="#f0dfb9" opacity=".48"/>
    <polygon points="123,18 182,127 157,110 127,50" fill="#d9e7e2" opacity=".8"/>
    <polygon points="182,127 80,176 103,138 157,110" fill="#d1e2e2" opacity=".52"/>
    <polygon points="71,78 127,50 157,110 103,138" fill="#e8ede8" opacity=".42"/>
  </g>

  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polygon id="near-face" points="24,67 123,18 182,127 80,176" stroke="#47777b" stroke-width="2.35"/>
    <polygon id="far-face" points="71,78 127,50 157,110 103,138" stroke="#657d7e" stroke-width="1.75"/>
    <g id="joining-edges" stroke="#af8846" stroke-width="1.85">
      <line x1="24" y1="67" x2="71" y2="78"/>
      <line x1="123" y1="18" x2="127" y2="50"/>
      <line x1="182" y1="127" x2="157" y2="110"/>
      <line x1="80" y1="176" x2="103" y2="138"/>
    </g>
  </g>

  <g id="teal-part" fill="#39757b" stroke="white" stroke-width="1.3">
    <circle cx="24" cy="67" r="5.8"/>
    <circle cx="182" cy="127" r="5.8"/>
    <circle cx="127" cy="50" r="5.5"/>
    <circle cx="103" cy="138" r="5.5"/>
  </g>
  <g id="gold-part" fill="#fffaf0" stroke="#a77934" stroke-width="2.05">
    <circle cx="123" cy="18" r="4.85"/>
    <circle cx="80" cy="176" r="4.85"/>
    <circle cx="71" cy="78" r="4.65"/>
    <circle cx="157" cy="110" r="4.65"/>
  </g>
</svg>
